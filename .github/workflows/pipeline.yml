name: Pipeline Tests

on:
  workflow_dispatch:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ 'main' ]
  schedule:
    - cron: 0 0 * * *

permissions:
  contents: read

jobs:
  flake8:
    strategy:
      matrix:
        os: [ 'ubuntu-latest' ]
        python-version: &PYTHON_VERSIONS ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U flake8 flake8-polyfill robotframework
      - name: Analysing the code with flake8
        run: |
          flake8 $(git ls-files '*.py') --count --show-source --max-complexity=11 --statistics

  pylint:
    strategy:
      matrix:
        os: [ 'ubuntu-latest' ]
        python-version: *PYTHON_VERSIONS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U setuptools_scm setuptools pylint robotframework
      - name: Analysing the code with pylint
        run: |
          pylint $(git ls-files '*.py')

  robot-framework:
    strategy:
      fail-fast: false
      matrix:
        os: [ 'ubuntu-latest', 'windows-latest' ]
        python-version: *PYTHON_VERSIONS
        robotframework-version: [ '5.0.1', '6.0.2', '6.1', '6.1.1', '7.0', '7.0.1', '7.2.2', 'latest' ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip
          pip install -U setuptools_scm setuptools
      - name: Install robotframework latest
        if: ${{ matrix.robotframework-version == 'latest' }}
        run: |
          pip install -U robotframework
      - name: Install robotframework ${{ matrix.robotframework-version }}
        if: ${{ matrix.robotframework-version != 'latest' }}
        run: |
          pip install robotframework==${{ matrix.robotframework-version }}
      - name: Install AsyncLibrary
        run: |
          pip install -e .
      - name: Executing Robot Framework Tests
        run: |
          robot test/ 2>&1
